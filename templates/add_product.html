<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
</head>
<body>
    <h1>Add a Product</h1>
    <form method="POST">
        <label>Name: <input type="text" name="name" required></label><br><br>
        <label>Size: <input type="text" name="size" required></label><br><br>
        <label>Price: <input type="number" name="price" required></label><br><br>
        <label>Quantity: <input type="number" name="quantity" required></label><br><br>
        <button type="submit">Add Product</button>
    </form>
</body>
</html>
