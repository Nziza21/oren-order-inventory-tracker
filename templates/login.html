<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ORÉN Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f2ee;
            overflow: hidden;
        }
        .stage {
            position: fixed;
            top: -25%;
            bottom: -25%;
            left: -20%;
            right: -20%;
            transform: rotate(-8deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 56px;
        }
        .row {
            display: flex;
            align-items: center;
            width: max-content;
            animation: slideLeft 90s linear infinite;
        }
        .row.right { animation-name: slideRight; }
        .row:nth-child(2n) { animation-duration: 110s; }
        .row:nth-child(3n) { animation-duration: 130s; }
        .row img {
            height: 110px;
            width: auto;
            flex: none;
            margin-right: 90px;
            opacity: 0.07;
        }
        .row:nth-child(odd) img { opacity: 0.045; }
        @keyframes slideLeft {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        @keyframes slideRight {
            from { transform: translateX(-50%); }
            to { transform: translateX(0); }
        }
        .veil {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: radial-gradient(circle at center, rgba(244,242,238,0.92) 0%, rgba(244,242,238,0.5) 50%, rgba(244,242,238,0) 100%);
        }
        .card {
            position: relative;
            z-index: 2;
            background: white;
            padding: 38px 34px 34px;
            border-radius: 12px;
            width: 100%;
            max-width: 370px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }
        .logo { height: 84px; display: block; margin-bottom: 10px; }
        .sub { margin: 0 0 26px; font-size: 14px; color: #777; }
        label { display: block; font-size: 14px; color: #444; margin-bottom: 18px; }
        input {
            width: 100%;
            padding: 11px 12px;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #111; }
        button {
            width: 100%;
            background: #111;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #333; }
        @media (prefers-reduced-motion: reduce) {
            .row { animation: none; }
        }
    </style>
</head>
<body>
    <div class="stage" id="stage"></div>
    <div class="veil"></div>
    <div class="card">
        <img src="{{ url_for('static', filename='logo-full-dark.png') }}" alt="ORÉN" class="logo">
        <p class="sub">Order &amp; Inventory Tracker</p>
        <form method="POST">
            <label>Password
                <input type="password" name="password" required autofocus>
            </label>
            <button type="submit">Log in</button>
        </form>
    </div>
    <script>
        var src = "{{ url_for('static', filename='logo-full-dark.png') }}";
        var stage = document.getElementById("stage");
        for (var r = 0; r < 8; r++) {
            var row = document.createElement("div");
            row.className = "row " + (r % 2 ? "left" : "right");
            row.style.animationDelay = "-" + (r * 17) + "s";
            var group = "";
            for (var k = 0; k < 12; k++) {
                group += '<img src="' + src + '" alt="">';
            }
            row.innerHTML = group + group;
            stage.appendChild(row);
        }
    </script>
</body>
</html>
