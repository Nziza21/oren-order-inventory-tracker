<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ORÉN Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #efece7;
            overflow: hidden;
        }
        .stage {
            position: fixed;
            top: -25%;
            bottom: -25%;
            left: -15%;
            right: -15%;
            transform: rotate(-8deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
        }
        .row {
            display: flex;
            gap: 18px;
            width: max-content;
            animation: slideLeft 70s linear infinite;
        }
        .row.right { animation-name: slideRight; }
        .row:nth-child(2n) { animation-duration: 90s; }
        .row:nth-child(3n) { animation-duration: 110s; }
        @keyframes slideLeft {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        @keyframes slideRight {
            from { transform: translateX(-50%); }
            to { transform: translateX(0); }
        }
        .tile {
            flex: none;
            padding: 28px 36px;
            border-radius: 8px;
            font-size: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .t0 { background: #ddd7cd; color: #9a9387; }
        .t1 { background: #c9c2b6; color: #7d776b; }
        .t2 { background: #1a1a2e; color: #6b6b8f; }
        .veil {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: radial-gradient(circle at center, rgba(239,236,231,0.9) 0%, rgba(239,236,231,0.4) 55%, rgba(239,236,231,0) 100%);
        }
        .card {
            position: relative;
            z-index: 2;
            background: white;
            padding: 36px 32px;
            border-radius: 10px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
        }
        h1 { margin: 0; font-size: 28px; letter-spacing: 3px; color: #1a1a2e; }
        .sub { margin: 4px 0 24px; font-size: 14px; color: #666; }
        label { display: block; font-size: 14px; color: #444; margin-bottom: 16px; }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: #4a4ae0;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #3a3ac0; }
        @media (prefers-reduced-motion: reduce) {
            .row { animation: none; }
        }
        .logo { height: 84px; display: block; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="stage" id="stage"></div>
    <div class="veil"></div>
    <div class="card">
        <img src="{{ url_for('static', filename='logo-full-dark.png') }}" alt="ORÉN" class="logo">
        <p class="sub">Order &amp; Inventory Tracker</p>
        <form method="POST">
            <label>Password
                <input type="password" name="password" required autofocus>
            </label>
            <button type="submit">Log in</button>
        </form>
    </div>
    <script>
        var words = ["The Threshold", "Tailored Shirt", "Suit Jacket", "Tailored Trouser", "Becoming", "ORÉN", "Mid-process", "Quietly confident"];
        var stage = document.getElementById("stage");
        for (var r = 0; r < 9; r++) {
            var row = document.createElement("div");
            row.className = "row " + (r % 2 ? "left" : "right");
            var html = "";
            for (var k = 0; k < 4; k++) {
                for (var i = 0; i < words.length; i++) {
                    var w = words[(i + r * 3) % words.length];
                    html += '<span class="tile t' + ((i + r) % 3) + '">' + w + '</span>';
                }
            }
            row.innerHTML = html;
            stage.appendChild(row);
        }
    </script>
</body>
</html>
