<!DOCTYPE html>
<html>
<head>
    <title>ORÉN Orders</title>
</head>
<body>
    <h1>ORÉN Orders</h1>
    <form method="GET" action="/orders/search">
    <input type="text" name="q" placeholder="Search by customer name" value="{{ search_query or '' }}">
    <button type="submit">Search</button>
    </form>
    <br>
    <table border="1" cellpadding="8">
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Date</th>
            <th>Payment</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        {% for order in orders %}
        <tr>
            <td><a href="/orders/{{ order.id }}">{{ order.id }}</a></td>
            <td>{{ order.customer }}</td>
            <td>{{ order.order_date }}</td>
            <td>{{ order.payment_status }}</td>
            <td>{{ order.order_status }}</td>
            <td><a href="/orders/{{ order.id }}/update">Update status</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
