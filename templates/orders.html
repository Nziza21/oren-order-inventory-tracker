<!DOCTYPE html>
<html>
<head>
    <title>ORÉN Orders</title>
</head>
<body>
    <h1>ORÉN Orders</h1>
    <table border="1" cellpadding="8">
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Date</th>
            <th>Payment</th>
            <th>Status</th>
        </tr>
        {% for order in orders %}
        <tr>
            <td>{{ order.id }}</td>
            <td>{{ order.customer }}</td>
            <td>{{ order.order_date }}</td>
            <td>{{ order.payment_status }}</td>
            <td>{{ order.order_status }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
