<!DOCTYPE html>
<html>
<head>
    <title>ORÉN Products</title>
</head>
<body>
    <h1>ORÉN Products</h1>
    <table border="1" cellpadding="8">
        <tr>
            <th>Name</th>
            <th>Size</th>
            <th>Price (RWF)</th>
            <th>Quantity</th>
            <th>Action</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>{{ product.size }}</td>
            <td>{{ product.price }}</td>
            {% if product.quantity < 5 %}
            <td style="color: red; font-weight: bold;">{{ product.quantity }} (Low stock)</td>
            {% else %}
            <td>{{ product.quantity }}</td>
            {% endif %}
            <td><a href="/products/{{ product.id }}/update_stock">Update stock</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
