{% extends "base.html" %}
{% block title %}Stock History{% endblock %}
{% block content %}
<h1>Stock History</h1>
<table>
    <tr>
        <th>Date</th>
        <th>Product</th>
        <th>Size</th>
        <th>Change</th>
        <th>Reason</th>
    </tr>
    {% for log in logs %}
    <tr>
        <td>{{ log.log_date }}</td>
        <td>{{ log.name }}</td>
        <td>{{ log.size }}</td>
        <td>{{ "%+d"|format(log.change_amount) }}</td>
        <td>{{ log.reason }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
